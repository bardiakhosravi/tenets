name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 18
          - 20
          - 22

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run bundle
      - name: Verify bundled rules are committed
        working-directory: .
        run: git diff --exit-code -- cli/bundled

  package:
    name: Package contents
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm pack --dry-run

  demo:
    name: Demo fixture
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify intentional architecture violations
        run: python -m unittest discover examples/architecture-review-demo/tests -v
      - name: Verify captured CLI output
        run: |
          demo/act-009/capture-demo.sh
          git diff --exit-code -- demo/act-009/captured
